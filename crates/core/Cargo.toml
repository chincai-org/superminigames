[package]
name = "superminigames-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
superminigames-logic = { path = "../logic" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
rand_core = "0.6"
# Spec RNG-5 pins this API (`set_stream`, `from_seed`, `next_u64`), so the 0.3
# line is required: a 0.9 upgrade changes the trait paths and the draw values.
rand_chacha = "0.3"

[dev-dependencies]
# scripts/check-deps.sh permits serde_json as shared test tooling.
serde_json = "1"
[features]
test-support = []
