[package]
name = "superminigames-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
superminigames-core = { path = "../core" }
superminigames-logic = { path = "../logic" }
rand_core = "0.6"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
# scripts/check-deps.sh permits serde_json as shared test tooling; the engine
# tests use it only to build deterministic `PlayerId` values.
serde_json = "1"
